services:
  # Backend Web Service
  - type: web
    name: pathfinder-backend
    env: python
    buildCommand: "cd Backend && pip install -r requirements.txt"
    startCommand: "cd Backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PROJECT_NAME
        value: "PathFinder API"
      # These keys will be created as blank by default, you must fill them in the Render Dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "gemini"

  # Frontend Static Site
  - type: web
    name: pathfinder-frontend
    env: static
    buildCommand: "cd Frontend && npm install && npm run build"
    staticPublishPath: "./Frontend/dist"
    envVars:
      - key: VITE_API_URL
        # This automatically uses the backend URL generated by Render
        fromService:
          type: web
          name: pathfinder-backend
          envVarKey: RENDER_EXTERNAL_URL
      # These keys will be created as blank by default, you must fill them in the Render Dashboard
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
